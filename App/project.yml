# Projet Xcode généré par XcodeGen sur le runner macOS (aucun .xcodeproj versionné).
name: Minuit
options:
  bundleIdPrefix: app.minuit
  deploymentTarget:
    tvOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: fr

packages:
  MinuitCore:
    path: ..
  AetherEngine:
    url: https://github.com/superuser404notfound/AetherEngine
    # Version figée : le projet publie très souvent ; toute montée de version est un choix explicite.
    exactVersion: 7.54.0

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Minuit:
    type: application
    platform: tvOS
    sources:
      - path: Sources
      - path: Resources
        excludes: ["Info.plist"]
    dependencies:
      - package: MinuitCore
      - package: AetherEngine
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Minuit
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: fr
        UIRequiredDeviceCapabilities: [arm64]
        UIUserInterfaceStyle: Dark
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIAppSupportsHDR: true
        # Politique explicite : les serveurs Xtream sont saisis par l'utilisateur et très
        # majoritairement en HTTP. ATS ne peut pas être restreint à des domaines inconnus.
        # ATTENTION : n'ajouter AUCUNE autre clé (NSAllowsArbitraryLoadsForMedia, …) :
        # leur présence fait ignorer NSAllowsArbitraryLoads et bloque l'API en HTTP.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: "Minuit ouvre une page sur votre réseau local pour configurer l’Apple TV depuis votre téléphone."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.minuit.tv
        PRODUCT_NAME: Minuit
        TARGETED_DEVICE_FAMILY: "3"
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: targeted
        ASSETCATALOG_COMPILER_APPICON_NAME: App Icon & Top Shelf Image
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        # IPA non signée : la signature est faite par atvloadly (Sideloader) avec votre identifiant Apple.
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""

  MinuitUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - path: UITests
    dependencies:
      - target: Minuit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.minuit.tv.uitests
        TEST_TARGET_NAME: Minuit
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"

schemes:
  Minuit:
    build:
      targets:
        Minuit: all
        MinuitUITests: [test]
    test:
      config: Debug
      targets:
        - MinuitUITests
    run:
      config: Debug
    archive:
      config: Release

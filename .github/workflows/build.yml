name: Build

# Même méthode que Lanterne : chaque push compile l'application sur un Mac GitHub
# (gratuit, le dépôt est public), vérifie l'IPA et, sur main, la publie en Release.

on:
  push:
    branches: ["main", "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Image GitHub « xcode-27 » (macOS 27, ARM64) : chaîne d'outils de référence d'AetherEngine.
  XCODE_APP: /Applications/Xcode_27.1.app
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  core-tests:
    name: Tests MinuitCore (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        shell: bash
        run: |
          set -o pipefail
          swift test --parallel 2>&1 | tee core-tests.log
      - name: Vérifications statiques
        run: sh scripts/static-checks.sh
      - name: Journaux de test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-tests-log
          path: core-tests.log
          retention-days: 14

  app:
    name: Application tvOS (IPA)
    runs-on: xcode-27
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Sélection de Xcode
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          xcrun --sdk appletvos --show-sdk-version
      - name: XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version
          xcodegen generate --spec App/project.yml
      - name: Version
        id: version
        run: |
          MARKETING=$(grep -E '^\s+MARKETING_VERSION:' App/project.yml | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=${MARKETING}" >> "$GITHUB_OUTPUT"
          echo "build=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Version ${MARKETING} (${GITHUB_RUN_NUMBER}) — commit ${GITHUB_SHA::8}" >> "$GITHUB_STEP_SUMMARY"
      - name: Cache des paquets Swift
        uses: actions/cache@v4
        with:
          path: App/.spm
          key: spm-xcode27-${{ hashFiles('App/project.yml', 'Package.swift') }}
          restore-keys: spm-xcode27-
      - name: Résolution des dépendances
        run: |
          set -o pipefail
          xcodebuild -resolvePackageDependencies -project App/Minuit.xcodeproj -scheme Minuit \
            -clonedSourcePackagesDirPath App/.spm -skipPackagePluginValidation -skipMacroValidation 2>&1 | tee resolve.log
      - name: Compilation (appareil tvOS, arm64)
        run: |
          STATUS=0
          xcodebuild build \
            -project App/Minuit.xcodeproj -scheme Minuit -configuration Release \
            -destination 'generic/platform=tvOS' \
            -derivedDataPath build/dd -clonedSourcePackagesDirPath App/.spm \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ steps.version.outputs.build }} \
            > build.log 2>&1 || STATUS=$?
          grep -E "error:|warning:.*App/Sources|BUILD (SUCCEEDED|FAILED)" build.log | sort -u | head -n 300 || true
          echo "xcodebuild : code de sortie $STATUS"
          exit $STATUS
      - name: Résumé des erreurs de compilation
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -n 100 >> "$GITHUB_STEP_SUMMARY" || true
      - name: IPA non signée
        run: |
          IPA="dist/Minuit-${{ steps.version.outputs.version }}-${{ steps.version.outputs.build }}-unsigned.ipa"
          bash scripts/package-ipa.sh build/dd/Build/Products/Release-appletvos/Minuit.app "$IPA"
          bash scripts/verify-ipa.sh "$IPA" app.minuit.tv
          shasum -a 256 dist/*.ipa | tee dist/SHA256SUMS.txt
      - name: Artefact IPA
        uses: actions/upload-artifact@v4
        with:
          name: Minuit-${{ steps.version.outputs.version }}-${{ steps.version.outputs.build }}
          path: |
            dist/*.ipa
            dist/SHA256SUMS.txt
          retention-days: 30
      - name: Journaux de compilation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_number }}
          path: |
            build.log
            resolve.log
          retention-days: 14

  ui-tests:
    name: Tests d'interface (simulateur tvOS, mode démo)
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: write
    # Indicatifs : un échec n'empêche pas la publication de l'IPA, mais le journal
    # montre les étapes et, en cas de fermeture de l'app, le rapport de plantage.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Sélection de Xcode
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcrun simctl list devices available | grep -i "apple tv" || true
      - name: XcodeGen
        run: |
          brew install xcodegen
          xcodegen generate --spec App/project.yml
      - name: Cache des paquets Swift
        uses: actions/cache@v4
        with:
          path: App/.spm
          key: spm-xcode27-${{ hashFiles('App/project.yml', 'Package.swift') }}
          restore-keys: spm-xcode27-
      - name: xcodebuild test
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -E "Apple TV 4K \(3rd generation\) \(" | grep -v "1080p" | head -n1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          echo "Simulateur : $DEVICE"
          STATUS=0
          xcodebuild test \
            -project App/Minuit.xcodeproj -scheme Minuit \
            -destination "id=$DEVICE" \
            -derivedDataPath build/dd-test -clonedSourcePackagesDirPath App/.spm \
            -skipPackagePluginValidation -skipMacroValidation \
            -resultBundlePath ui-tests.xcresult \
            CODE_SIGNING_ALLOWED=NO > ui-tests.log 2>&1 || STATUS=$?
          grep -E "MINUIT-UITEST|Test Case .*(passed|failed)|error:|crash|Crash|TEST (SUCCEEDED|FAILED)" ui-tests.log | head -n 300 || true
          echo "xcodebuild test : code de sortie $STATUS"
          exit $STATUS
      - name: Rapports de plantage (simulateur)
        if: always()
        run: |
          found=0
          for f in $(find "$HOME/Library/Logs/DiagnosticReports" -name "Minuit*" -mmin -90 2>/dev/null); do
            found=1
            echo "===== $f"
            head -c 30000 "$f"
            echo
          done
          [ "$found" = 1 ] || echo "Aucun rapport de plantage de Minuit."
      - name: Captures d'écran (branche ci-screenshots)
        # Publiées sur une branche dédiée (non déclencheuse de build) pour la revue visuelle.
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf shots && mkdir shots
          xcrun xcresulttool export attachments --path ui-tests.xcresult --output-path shots || true
          ls shots | head -40
          [ -n "$(ls shots/*.png 2>/dev/null)" ] || { echo "Aucune capture."; exit 0; }
          cd shots
          git init -q && git checkout -q -b ci-screenshots
          echo "Build $GITHUB_RUN_NUMBER — commit $GITHUB_SHA" > README.md
          git add . && git -c user.name="minuit-ci" -c user.email="minuit-ci@users.noreply.github.com" commit -qm "Captures du build $GITHUB_RUN_NUMBER"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots
          echo "Captures publiées sur la branche ci-screenshots."
      - name: Résultats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-tests-${{ github.run_number }}
          path: |
            ui-tests.xcresult
            ui-tests.log
          retention-days: 14

  release:
    name: Publication (Release GitHub)
    # Chaque build réussi de main (et chaque tag v*) publie une Release avec l'IPA :
    # lien public stable pour l'installation via atvloadly.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [core-tests, app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Minuit-*
          merge-multiple: true
          path: dist
      - name: Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.app.outputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"; TITLE="Minuit $GITHUB_REF_NAME"
          else
            TAG="build-$GITHUB_RUN_NUMBER"; TITLE="Minuit $VERSION (build $GITHUB_RUN_NUMBER)"
          fi
          cat > notes.md <<NOTES
          IPA **non signée** pour atvloadly (signature par votre identifiant Apple à l'installation).
          Commit : $GITHUB_SHA
          Statut : compilée et vérifiée par la CI ; qualification sur Apple TV : voir docs/STATUS.md.
          NOTES
          gh release create "$TAG" dist/*.ipa dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TITLE" --notes-file notes.md --latest
          echo "Release : https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
